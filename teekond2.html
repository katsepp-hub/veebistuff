<!DOCTYPE html>
<html>
<head>
    <title>Kaart</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />

    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        #kaardikiht {
            width: 100%;
            height: 100%;
        }

        #selgitus {
            position: absolute;
            z-index: 1000;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
        }
    </style>

    <script>
        let kaart;
        let hypik;
        let marker1, marker2;

        function algus() {
            kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);

            new L.TileLayer(
                'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA',
                {
                    attribution: 'Map: <a href="http://www.maaamet.ee/">Maa-amet</a>',
                    tms: true
                }
            ).addTo(kaart);

            marker1 = L.marker([59.439, 24.773], {
                draggable: true
            }).addTo(kaart);

            marker2 = L.marker([59.439, 24.773], {
                draggable: true
            }).addTo(kaart);

            marker1.on("dragend", liikumine);
            marker2.on("dragend", liikumine);

            hypik = L.popup();

            kaart.on("click", vajutus);

            liikumine();
        }

        function liikumine() {
            let kaugus = marker1.getLatLng()
                .distanceTo(marker2.getLatLng());

            document.getElementById("selgitus").innerText =
                "Kaugus: " + Math.round(kaugus) + " m";
        }

        function vajutus(e) {
            hypik
                .setLatLng(e.latlng)
                .setContent("Vajutasid " + e.latlng.toString())
                .openOn(kaart);
        }
    </script>
</head>

<body onload="algus()">

    <div id="selgitus"></div>
    <div id="kaardikiht"></div>

</body>
</html>
