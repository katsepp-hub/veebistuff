<!DOCTYPE html>
<html>
 <head>
	 <meta charset="UTF-8">
 <title>Kaart</title>

<link rel="stylesheet"
	href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

	 let kaart
	 let hypik
	 let marker1, marker2;
	 function algus(){
		 kaart = L.map('kaardikiht').setView([59.439, 24.773], 12);
		 new L.TileLayer(
  'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
	  attribution: "Map: <a  href='http://www.maaamet.ee/'>Maa-amet</a>",
	  tms: true,
    }).addTo(kaart);
		 marker1=L.marker([59.439, 24.773], {draggable: true});
		 marker2=L.marker([59.439, 24.773], {draggable: true});
		 marker1.addTo(kaart);
		 marker2.adTo(kaart);
		 hypik=L.popup();
		 kaart.on("click", vajutus);
	 }
	 
	 function liikumine(){
		 selgitus.innerText=Math.round(marker1.getLatLng().distanceTo(marker2.getLatLng()))/1000+" km";
	 }
	 
	 function kuvaTee(andmed){
		 tee=andmed.routes[0];
		 console.log(tee["duration"], tee["distance"]);
		 console.log(tee["geometry"]);
		 L.geoJSON(tee.geometry).addTo(kaart);
		
   }

  </script>
 </head>  
 <body onload="algus()">
  <div id="kaardikiht"></div>
 </body>
</html>
